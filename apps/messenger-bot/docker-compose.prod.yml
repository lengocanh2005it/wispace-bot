services:
  messenger-bot:
    image: ${IMAGE:?IMAGE is required}
    container_name: ${CONTAINER_NAME:-messenger-bot}
    restart: unless-stopped
    user: '${DEPLOY_UID:?DEPLOY_UID is required}:${DEPLOY_GID:?DEPLOY_GID is required}'
    env_file:
      - .env
    environment:
      HOME: /tmp
    ports:
      - '127.0.0.1:${PORT:-5007}:${PORT:-5007}'
    mem_limit: 512M
    mem_reservation: 256M
    cpus: '1.0'
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        ['CMD', 'wget', '-qO-', 'http://localhost:${PORT:-5007}/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
