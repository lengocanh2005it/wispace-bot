services:
  zalo-bot:
    image: ${IMAGE:?IMAGE is required}
    container_name: ${CONTAINER_NAME:-zalo-bot}
    restart: unless-stopped
    user: '${DEPLOY_UID:?DEPLOY_UID is required}:${DEPLOY_GID:?DEPLOY_GID is required}'
    env_file:
      - .env
    environment:
      HOME: /tmp
    ports:
      - '127.0.0.1:${PORT:-3002}:${PORT:-3002}'
    group_add:
      - '${DOCKER_GID:?DOCKER_GID is required}'
    volumes:
      - ./.env:/deploy/.env
      - ./docker-compose.prod.yml:/deploy/docker-compose.prod.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 256M
    mem_reservation: 128M
    cpus: '0.5'
