services:
  discord-bot:
    image: ${IMAGE:?IMAGE is required}
    container_name: ${CONTAINER_NAME:-discord-bot}
    restart: unless-stopped
    user: '${DEPLOY_UID:?DEPLOY_UID is required}:${DEPLOY_GID:?DEPLOY_GID is required}'
    env_file:
      - .env
    environment:
      HOME: /tmp
    ports:
      - '127.0.0.1:${PORT:-3001}:${PORT:-3001}'
    mem_limit: 256M
    mem_reservation: 128M
    cpus: '0.5'
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        ['CMD', 'wget', '-qO-', 'http://localhost:${PORT:-3001}/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
