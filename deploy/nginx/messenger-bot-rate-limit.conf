# Included from nginx http {} via /etc/nginx/conf.d/
# Messenger webhook flood protection (Meta + fake POST bypass attempts).

limit_req_zone $binary_remote_addr zone=messenger_webhook:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=zalo_webhook:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=health_ready:10m rate=5r/s;
limit_req_status 429;
