; Reference configuration. The compose deployment generates this entry from
; PGBOUNCER_DB_HOST; it must resolve to the PostgreSQL writer endpoint.
[databases]
ai_chat_bot_db = host=writer-endpoint.example.internal port=5432 dbname=ai_chat_bot_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

; Session mode: connections are assigned to clients for the full client session.
; Required because the bots use PostgreSQL advisory locks (PgAdvisoryLockService)
; which need the same backend connection for the entire session.
pool_mode = session

; Maximum number of server connections to allow per pool.
pool_size = 20

; Maximum number of client connections allowed.
max_client_conn = 100

; Time after which idle server connections are closed.
server_idle_timeout = 300

; Time after which idle client connections are closed.
client_idle_timeout = 0

; Time to wait for a server connection from the pool.
server_connect_timeout = 5

; Time to wait for a query result from the server.
server_lifetime = 3600

; Log connections/disconnections.
log_connections = 1
log_disconnections = 1

; Log pooler errors.
log_pooler_errors = 1

; Stats period (0 = disabled).
stats_period = 60

; Auth type.
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
