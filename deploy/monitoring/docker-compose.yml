services:
  prometheus:
    image: prom/prometheus:v2.53.0@sha256:b8e8cec4bfdfda676f4334f4f2aab9d8758f51d76ac41fc35224f6ae79b79f54
    container_name: prometheus
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY_MESSENGER: ${INTERNAL_API_KEY_MESSENGER:-}
      INTERNAL_API_KEY_DISCORD: ${INTERNAL_API_KEY_DISCORD:-}
      INTERNAL_API_KEY_ZALO: ${INTERNAL_API_KEY_ZALO:-}
    volumes:
      - ./prometheus.tmpl:/etc/prometheus/prometheus.tmpl:ro
      - ./prometheus-entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - monitoring
      - messenger-bot_default
      - discord-bot_default
      - zalo-bot_default

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:45c3a586d4332d710bef92b06e90380c0b1f588968c00100d4b5e4e44c40ca5f
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.tmpl:/etc/alertmanager/alertmanager.tmpl:ro
      - ./alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # chat_id is an int64; 0 fails Alertmanager validation, so -1 = placeholder
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:--1}
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring

volumes:
  prometheus_data:
  alertmanager_data:

networks:
  monitoring:
    name: monitoring
  messenger-bot_default:
    external: true
  discord-bot_default:
    external: true
  zalo-bot_default:
    external: true
