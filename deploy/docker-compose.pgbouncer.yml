# PgBouncer connection pooler for all bots
# Sits between app containers and PostgreSQL to share connections.
#
# Usage:
#   docker compose -f deploy/docker-compose.pgbouncer.yml up -d
#
# All bots should set DB_HOST=pgbouncer (or the container name) in their .env.
# The bots connect to PgBouncer on port 5432, which multiplexes to PostgreSQL.

services:
  pgbouncer:
    image: bitnami/pgbouncer:1.23.1
    container_name: pgbouncer
    restart: unless-stopped
    ports:
      - "127.0.0.1:6432:5432"
    environment:
      # Backend PostgreSQL connection
      - POSTGRESQL_HOST=postgres_n8n_db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRESQL_DATABASE=ai_chat_bot_db

      # PgBouncer pool settings
      - PGBOUNCER_POOL_MODE=session
      - PGBOUNCER_POOL_SIZE=20
      - PGBOUNCER_MAX_CLIENT_CONN=100
      - PGBOUNCER_SERVER_IDLE_TIMEOUT=300
      - PGBOUNCER_SERVER_CONNECT_TIMEOUT=5
      - PGBOUNCER_AUTH_TYPE=md5

      # Logging
      - PGBOUNCER_LOG_CONNECTIONS=1
      - PGBOUNCER_LOG_DISCONNECTIONS=1
      - PGBOUNCER_LOG_POOLER_ERRORS=1

    networks:
      - default

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

networks:
  default:
    name: pgbouncer-net
