# PgBouncer connection pooler for all bots
# Sits between app containers and PostgreSQL to share connections.
#
# Usage:
#   docker compose -f deploy/docker-compose.pgbouncer.yml up -d
#
# All bots should set DB_HOST=pgbouncer (or the container name) in their .env.
# The bots connect to PgBouncer on port 5432, which multiplexes to PostgreSQL.

services:
  pgbouncer:
    image: edoburu/pgbouncer:1.25.2
    container_name: pgbouncer
    restart: unless-stopped
    ports:
      - "127.0.0.1:6432:5432"
    environment:
      # edoburu generates pgbouncer.ini and userlist.txt from these values.
      # Keep the password in the deployment environment, never in this file.
      DB_HOST: postgres_n8n_db
      DB_PORT: 5432
      DB_USER: ${PGBOUNCER_DB_USER:?PGBOUNCER_DB_USER is required}
      DB_PASSWORD: ${PGBOUNCER_DB_PASSWORD:?PGBOUNCER_DB_PASSWORD is required}
      DB_NAME: ai_chat_bot_db

      # PgBouncer pool settings
      POOL_MODE: session
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 100
      SERVER_IDLE_TIMEOUT: 300
      SERVER_CONNECT_TIMEOUT: 5
      AUTH_TYPE: md5

      # Logging
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
      LOG_POOLER_ERRORS: 1

    networks:
      - app_n8n_db_network
      - monitoring

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    mem_limit: 64M
    cpus: "0.25"

networks:
  app_n8n_db_network:
    external: true
    name: app_n8n_db_network
  monitoring:
    external: true
    name: monitoring
