name: Deploy Messenger Bot to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: Force Docker image rebuild
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-bot-reusable.yml
    with:
      app: messenger-bot
      vps_target_dir: /home/ngoc_anh/messenger-bot
      force_build: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
      extra_deploy_paths: |
        - '.github/workflows/deploy-messenger-bot.yml'
        - '.github/workflows/sync-env.yml'
        - '.github/scripts/**'
    secrets:
      doppler_token: ${{ secrets.DOPPLER_TOKEN_MESSENGER }}
      ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      vps_host: ${{ secrets.VPS_HOST }}
      vps_user: ${{ secrets.VPS_USER }}
