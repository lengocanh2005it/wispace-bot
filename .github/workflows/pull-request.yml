name: Verify Pull Request

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code (full history for gitleaks)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          config: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pinned-registry-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail on unpinned registry executables in build steps
        run: |
          set -euo pipefail
          HITS="$(grep -RInE 'npx[[:space:]]+(-y|--yes)|npx[[:space:]]+[a-z@][^[:space:]]*@[0-9]|npm[[:space:]]+exec[[:space:]]+-y|npx[[:space:]]+-y[[:space:]]+[a-z@]' \
            --include='Dockerfile*' --include='*.yml' --include='*.yaml' --include='*.mjs' --include='*.sh' . || true)"
          if [ -n "$HITS" ]; then
            echo "Unpinned registry executables found in build steps:"
            echo "$HITS"
            exit 1
          fi
          echo "No unpinned registry executables in build steps."

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pull request (format + lint + typecheck + test + build, affected packages only)
        if: github.event_name == 'pull_request'
        run: npm run verify:affected
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify trusted push (format + lint + typecheck + test + build)
        if: github.event_name == 'push'
        run: npm run verify
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify full scheduled (format + lint + typecheck + test + build)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx --no-install turbo run format:check lint typecheck test build --force
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

  database-bootstrap-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_chat_bot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: ai_chat_bot_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build database bootstrap dependencies
        run: npx --no-install turbo run build --filter=@wispace/discord-bot... --filter=@wispace/zalo-bot...
        env:
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Test compiled platform entity discovery
        run: npm run database:entity-discovery:test

      - name: Run real TypeORM database bootstrap smoke test
        run: npm run database:bootstrap-smoke

  database-migration-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_chat_bot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: ai_chat_bot_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build database migration dependencies
        run: npx --no-install turbo run build --filter=@wispace/messenger-bot... --filter=@wispace/discord-bot... --filter=@wispace/zalo-bot...
        env:
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run TypeORM migration compatibility test
        run: npm run database:migration-compatibility

  di-bootstrap-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bot: [discord, zalo]
    env:
      NODE_ENV: test
      REDIS_ENABLED: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.bot }} bot dependencies
        run: npx --no-install turbo run build --filter=@wispace/${{ matrix.bot }}-bot...
        env:
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run ${{ matrix.bot }} NestJS DI bootstrap smoke test
        run: npm test --workspace=@wispace/${{ matrix.bot }}-bot -- app.boot.spec.ts

  deploy-scripts-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test VPS self-pull deploy (concurrency + failure paths, #144/#172)
        run: bash .github/scripts/tests/vps-self-pull-deploy.test.sh

      - name: Test SSH deploy payload isolation (#282)
        run: bash .github/scripts/tests/ssh-deploy-vps.test.sh

      - name: Test pull request workflow Turbo credential scoping (#287)
        run: bash .github/scripts/tests/pull-request-workflow.test.sh

      - name: Test VPS deploy script (fail-closed + crash-safety + migration lock, #199/#201/#203/#204)
        run: bash .github/scripts/tests/vps-deploy.test.sh

      - name: Check type-only @wispace/database imports (#423)
        run: bash .github/scripts/check-database-type-imports.sh
