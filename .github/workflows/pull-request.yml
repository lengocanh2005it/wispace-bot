name: Verify Pull Request

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# Superseded PR runs are cancelled; push/schedule runs on main are never
# cancelled (they populate the Turbo remote cache and gate the deploy).
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action v3 lists PR commits during pull_request scans — needs
    # pull-requests: read in addition to contents: read, else 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code (full history for gitleaks)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  pinned-registry-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail on unpinned registry executables in build steps
        run: |
          set -euo pipefail
          HITS="$(grep -RInE 'npx[[:space:]]+(-y|--yes)|npx[[:space:]]+[a-z@][^[:space:]]*@[0-9]|npm[[:space:]]+exec[[:space:]]+-y|npx[[:space:]]+-y[[:space:]]+[a-z@]' \
            --include='Dockerfile*' --include='*.yml' --include='*.yaml' --include='*.mjs' --include='*.sh' . || true)"
          if [ -n "$HITS" ]; then
            echo "Unpinned registry executables found in build steps:"
            echo "$HITS"
            exit 1
          fi
          echo "No unpinned registry executables in build steps."

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pull request (format + lint + typecheck + test + build, affected packages only)
        if: github.event_name == 'pull_request'
        run: npm run verify:affected
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify trusted push (format + lint + typecheck + test + build)
        if: github.event_name == 'push'
        run: npm run verify
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify full scheduled (format + lint + typecheck + test + build)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx --no-install turbo run format:check lint typecheck test build --force
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

  database-bootstrap-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_chat_bot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Real Redis for the privacy-erasure smoke below (#537) — history,
      # queue buffer, and display-name cache erasure are only proven
      # correct against the real key shapes/data structures, not a mock.
      redis:
        image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: ai_chat_bot_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      NODE_ENV: test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build database bootstrap dependencies
        run: npx --no-install turbo run build --filter=@wispace/messenger-bot... --filter=@wispace/discord-bot... --filter=@wispace/zalo-bot...
        env:
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Test compiled platform entity discovery
        run: npm run database:entity-discovery:test

      - name: Run real TypeORM database bootstrap smoke test
        run: npm run database:bootstrap-smoke

      # #754: pins the UPDATE/DELETE tuple vs INSERT flat `query()` shapes the
      # shared extractQueryRows helper relies on, against the real Postgres 16.
      - name: Run raw query RETURNING shape smoke test
        if: '!cancelled()'
        run: npm run database:query-returning-shape-smoke

      - name: Run real study-reminder delivery outcome smoke test
        if: '!cancelled()'
        run: npm run study-reminder:delivery-smoke

      - name: Run real PrivacyDataService cross-platform smoke test (Postgres + Redis)
        if: '!cancelled()'
        run: npm run database:privacy-smoke

      # Folded in from the former database-migration-compatibility job: it
      # needed the identical npm ci + 3-bot turbo build, and every mode of
      # database-bootstrap-smoke.mjs drops the schema before it starts, so
      # the two share one Postgres safely. Runs last to leave the database
      # in the migrated state.
      - name: Run TypeORM migration compatibility test
        if: '!cancelled()'
        run: npm run database:migration-compatibility

  di-bootstrap-smoke:
    # One job rather than a discord/zalo matrix: the two bots share almost
    # their whole package dependency chain, so the matrix paid for a second
    # npm ci and a near-identical turbo build. `!cancelled()` keeps the old
    # fail-fast: false behaviour — zalo still reports if discord fails.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      REDIS_ENABLED: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build discord + zalo bot dependencies
        run: npx --no-install turbo run build --filter=@wispace/discord-bot... --filter=@wispace/zalo-bot...
        env:
          TURBO_CONCURRENCY: 2
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run discord NestJS DI bootstrap smoke test
        run: npm test --workspace=@wispace/discord-bot -- app.boot.spec.ts

      - name: Run zalo NestJS DI bootstrap smoke test
        if: '!cancelled()'
        run: npm test --workspace=@wispace/zalo-bot -- app.boot.spec.ts

  deploy-scripts-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test VPS self-pull deploy (concurrency + CI gate + failure paths, #144/#172/#694)
        run: bash .github/scripts/tests/vps-self-pull-deploy.test.sh

      - name: Test SSH deploy payload isolation (#282)
        run: bash .github/scripts/tests/ssh-deploy-vps.test.sh

      - name: Test pull request workflow Turbo credential scoping (#287)
        run: bash .github/scripts/tests/pull-request-workflow.test.sh

      - name: Test VPS deploy script (fail-closed + crash-safety + migration lock, #199/#201/#203/#204)
        run: bash .github/scripts/tests/vps-deploy.test.sh

      - name: Test Vault-only production delivery contract (#654)
        run: bash .github/scripts/tests/vault-only-deploy.test.sh

      - name: Check retired secret-manager references (#655)
        run: bash .github/scripts/check-secret-manager-references.sh

      - name: Check type-only @wispace/database imports (#423)
        run: bash .github/scripts/check-database-type-imports.sh

      - name: Check chat-agent WISPACE client imports (#425)
        run: bash .github/scripts/check-chat-agent-wispace-imports.sh

      - name: Check study-reminder-shared WISPACE client imports (#424)
        run: bash .github/scripts/check-study-reminder-shared-wispace-imports.sh

      - name: Check webhook inbound package boundary (#426)
        run: bash .github/scripts/check-webhook-inbound-database-imports.sh

      - name: Check OpenAI SDK import boundary (#427)
        run: bash .github/scripts/check-openai-sdk-imports.sh

      - name: Check log redaction — raw external ids in logger calls (#610)
        run: node .github/scripts/check-log-redaction.js
