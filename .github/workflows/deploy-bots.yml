name: Deploy bots to VPS

on:
  push:
    branches:
      - main
    # GitHub evaluates these in order, last match wins, so the trailing
    # negations really do exclude. dorny/paths-filter cannot express this:
    # it compiles each list entry as its own picomatch and ORs them, so a
    # `!` entry there matches every file it does not name and the filter
    # ends up always true. Keep the exclusions here, not in the `changes`
    # job. Specs, docs and markdown never reach the runtime image.
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '!**/*.spec.ts'
      - '!**/*.test.ts'
      - '!**/__tests__/**'
      - '!**/docs/**'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      force_build:
        description: Force Docker image rebuild
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

# The image listener port is fixed per bot; vps-deploy.sh owns the alternating
# host ports and the shared monitoring-network alias during blue-green cutover.

jobs:
  deploy-messenger-bot:
    uses: ./.github/workflows/deploy-bot-reusable.yml
    with:
      app: messenger-bot
      vps_target_dir: /home/ngoc_anh/messenger-bot
      force_build: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
      health_path: /health/ready
      vault_addr: ${{ vars.VAULT_ADDR }}
    secrets:
      vault_role_id: ${{ secrets.VAULT_ROLE_ID_MESSENGER }}
      vault_secret_id: ${{ secrets.VAULT_SECRET_ID_MESSENGER }}
      ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      vps_host: ${{ secrets.VPS_HOST }}
      vps_known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      vps_user: ${{ secrets.VPS_USER }}

  deploy-discord-bot:
    # No longer needs to be serialized after deploy-messenger-bot: the SSH
    # deploy step is skipped for normal pushes (see deploy-bot-reusable.yml),
    # so there's no shared VPS SSH session to contend for anymore.
    uses: ./.github/workflows/deploy-bot-reusable.yml
    with:
      app: discord-bot
      vps_target_dir: /home/ngoc_anh/discord-bot
      force_build: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
      health_path: /health/ready
      vault_addr: ${{ vars.VAULT_ADDR }}
    secrets:
      vault_role_id: ${{ secrets.VAULT_ROLE_ID_DISCORD }}
      vault_secret_id: ${{ secrets.VAULT_SECRET_ID_DISCORD }}
      ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      vps_host: ${{ secrets.VPS_HOST }}
      vps_known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      vps_user: ${{ secrets.VPS_USER }}

  deploy-zalo-bot:
    uses: ./.github/workflows/deploy-bot-reusable.yml
    with:
      app: zalo-bot
      vps_target_dir: /home/ngoc_anh/zalo-bot
      force_build: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
      health_path: /health/ready
      vault_addr: ${{ vars.VAULT_ADDR }}
    secrets:
      vault_role_id: ${{ secrets.VAULT_ROLE_ID_ZALO }}
      vault_secret_id: ${{ secrets.VAULT_SECRET_ID_ZALO }}
      ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      vps_host: ${{ secrets.VPS_HOST }}
      vps_known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      vps_user: ${{ secrets.VPS_USER }}
