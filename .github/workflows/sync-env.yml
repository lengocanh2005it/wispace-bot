name: Sync production env (no image build)

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-env-messenger-bot:
    uses: ./.github/workflows/deploy-bot-reusable.yml
    with:
      app: messenger-bot
      vps_target_dir: /home/ngoc_anh/messenger-bot
      health_path: /health/ready
      env_only: true
    secrets:
      doppler_token: ${{ secrets.DOPPLER_TOKEN_MESSENGER }}
      ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      vps_host: ${{ secrets.VPS_HOST }}
      vps_known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      vps_user: ${{ secrets.VPS_USER }}
