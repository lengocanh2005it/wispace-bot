# #635 — required guardrail battery: 100% on the must-block core set,
# adversarial bypass rate within threshold. Path-filtered to prompt /
# #1238: this battery stays read-only; the separate eval-rehash-policy
# workflow gates prompt/evaluator changes that rewrite fixture hashes.
# agent / tool-schema changes; skipped (no status reported) for
# unrelated PRs. Maintainers: enable branch protection for the
# `guardrail-battery` check once merged.
name: guardrail-battery

on:
  pull_request:
    paths:
      - 'packages/llm-agent/**'
      - 'packages/chat-agent/src/agent/**'
      - 'apps/*/src/shared/prompts/**'
      - 'apps/messenger-bot/src/modules/messenger/application/agent/**'
      - 'package.json'
      - '.github/workflows/guardrail-battery.yml'
      - '.github/workflows/eval-rehash-policy.yml'

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build llm-agent
        run: npx --no-install turbo run build --filter=@wispace/llm-agent

      - name: Verify eval fixture prompt hashes (#724)
        run: npm run eval:rehash:check --workspace=@wispace/llm-agent

      - name: Run guardrail battery (#635)
        run: npm run eval:guardrail --workspace=@wispace/llm-agent
