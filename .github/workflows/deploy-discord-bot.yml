name: Deploy Discord Bot to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: Force Docker image rebuild
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy-discord-bot
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-bot-reusable.yml
    with:
      app: discord-bot
      vps_target_dir: /home/ngoc_anh/discord-bot
      health_path: /health
      force_build: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
    secrets:
      doppler_token: ${{ secrets.DOPPLER_TOKEN_DISCORD }}
      ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      vps_host: ${{ secrets.VPS_HOST }}
      vps_known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      vps_user: ${{ secrets.VPS_USER }}
