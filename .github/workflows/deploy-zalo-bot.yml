name: Deploy Zalo Bot to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: Force Docker image rebuild
        type: boolean
        default: false

concurrency:
  group: production-deploy-zalo-bot
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-bot-reusable.yml
    with:
      app: zalo-bot
      vps_target_dir: /home/ngoc_anh/zalo-bot
      force_build: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
    secrets:
      doppler_token: ${{ secrets.DOPPLER_TOKEN_ZALO }}
      ghcr_pull_token: ${{ secrets.GHCR_PULL_TOKEN }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      vps_host: ${{ secrets.VPS_HOST }}
      vps_user: ${{ secrets.VPS_USER }}
