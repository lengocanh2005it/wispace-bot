name: Deploy bot to VPS (reusable)

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
        description: App directory name, e.g. messenger-bot
      vps_target_dir:
        required: true
        type: string
        description: Remote directory on the VPS, e.g. /home/ngoc_anh/messenger-bot
      force_build:
        required: false
        type: boolean
        default: false
      health_path:
        required: false
        type: string
        description: Readiness check path on the deployed bot, e.g. /health/ready (empty = skip)
        default: ''
      env_only:
        required: false
        type: boolean
        description: Skip image build/migrations, only push .env from Doppler and restart (FORCE_RECREATE=true)
        default: false
    secrets:
      doppler_token:
        required: false
      ghcr_pull_token:
        required: true
      ssh_private_key:
        required: true
      vps_host:
        required: true
      vps_known_hosts:
        required: true
      vps_user:
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            app:
              - 'apps/${{ inputs.app }}/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            deploy:
              - 'apps/${{ inputs.app }}/docker-compose.prod.yml'
              - 'deploy/Dockerfile.bot'
              - 'deploy/verify-runtime-image.mjs'
              - '.github/workflows/**'
              - '.github/scripts/**'

  build-image:
    needs: changes
    if: |
      inputs.env_only != true &&
      (needs.changes.outputs.app == 'true' ||
        inputs.force_build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.prep.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image reference
        id: prep
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${REPO_LC}/${{ inputs.app }}:${{ github.sha }}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${{ env.REGISTRY }}/${REPO_LC}/${{ inputs.app }}:latest" >> "$GITHUB_ENV"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.bot
          build-args: |
            APP_NAME=${{ inputs.app }}
            # Fixed internal listener port; blue-green host ports are selected by vps-deploy.sh.
            APP_PORT=${{ inputs.app == 'messenger-bot' && '5007' || (inputs.app == 'discord-bot' && '3001' || '3002') }}
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_LATEST }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrations-check:
    # Gate the deploy: apply the migration chain against a real Postgres
    # inside the freshly built image. A broken migration must stop the
    # deploy here, not crash the bot on the VPS.
    # Only messenger-bot has a data-source CLI entry; all 3 bots share one
    # DB + one migration set, so this job runs for messenger only.
    needs: build-image
    if: |
      always() &&
      !cancelled() &&
      inputs.env_only != true &&
      needs.build-image.result == 'success' &&
      inputs.app == 'messenger-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ needs.build-image.outputs.image }}
    services:
      postgres:
        image: postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_chat_bot_db
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ai_chat_bot_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      NODE_ENV: test
      # Docker-internal hostname cannot be IP-classified — explicit plaintext
      # exception required by the NODE_ENV-independent TLS enforcement.
      DB_ALLOW_INSECURE_HOSTS: postgres
    steps:
      - name: Check for duplicate migration timestamps
        run: bash .github/scripts/check-migration-timestamps.sh packages/database/src/migrations
      # The container job runs with CWD=/github/workspace, but the image's
      # typeorm CLI lives in /app/node_modules/.bin — cd into /app first.
      - name: Show migration status (pending)
        run: |
          cd /app
          npx --no-install typeorm migration:show -d apps/${{ inputs.app }}/dist/infrastructure/database/data-source.js

      - name: Apply migrations
        run: |
          cd /app
          npx --no-install typeorm migration:run -d apps/${{ inputs.app }}/dist/infrastructure/database/data-source.js
      - name: Show migration status (applied)
        run: |
          cd /app
          npx --no-install typeorm migration:show -d apps/${{ inputs.app }}/dist/infrastructure/database/data-source.js

  runtime-image-check:
    needs: build-image
    if: |
      always() &&
      !cancelled() &&
      inputs.env_only != true &&
      needs.build-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify runtime image contents and size
        run: |
          docker pull "${{ needs.build-image.outputs.image }}"
          node deploy/verify-runtime-image.mjs "${{ needs.build-image.outputs.image }}" "${{ inputs.app }}"

  deploy:
    # SSH deploy now only runs for the env-only path (manual sync-env.yml
    # dispatch). Normal image deploys are picked up by the VPS itself via
    # .github/scripts/vps-self-pull-deploy.sh (cron, outbound git/docker
    # pull) — the Hostinger edge network intermittently drops inbound SSH
    # from GitHub Actions runner IPs regardless of port/retries, so pushing
    # from CI on every commit is no longer reliable.
    needs: [changes, build-image, migrations-check]
    if: |
      always() &&
      !cancelled() &&
      inputs.env_only == true &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') &&
      (needs.migrations-check.result == 'success' || needs.migrations-check.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
      VPS_HOST: ${{ secrets.vps_host }}
      VPS_KNOWN_HOSTS: ${{ secrets.vps_known_hosts }}
      VPS_USER: ${{ secrets.vps_user }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      MIGRATION_CMD: ${{ !inputs.env_only && inputs.app == 'messenger-bot' && 'npx --no-install typeorm migration:run -d apps/messenger-bot/dist/infrastructure/database/data-source.js' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve deploy image
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ needs.build-image.result }}" = "success" ]; then
            echo "IMAGE=${{ env.REGISTRY }}/${REPO_LC}/${{ inputs.app }}:${{ github.sha }}" >> "$GITHUB_ENV"
            echo "DEPLOY_MODE=new-build" >> "$GITHUB_ENV"
          else
            echo "IMAGE=${{ env.REGISTRY }}/${REPO_LC}/${{ inputs.app }}:latest" >> "$GITHUB_ENV"
            echo "DEPLOY_MODE=reuse-latest" >> "$GITHUB_ENV"
          fi

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Download production env from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.doppler_token }}
        run: |
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "DOPPLER_TOKEN not set — VPS will keep existing .env"
            exit 0
          fi
          doppler secrets download --no-file --format env > production.env
          chmod 600 production.env
          echo "Downloaded $(wc -l < production.env) lines from Doppler"
          echo "has_production_env=true" >> "$GITHUB_ENV"

      - name: Prepare VPS upload bundle
        run: |
          mkdir -p upload-bundle
          cp apps/${{ inputs.app }}/docker-compose.prod.yml upload-bundle/
          cp .github/scripts/vps-deploy.sh upload-bundle/
          # Copy nginx upstream config for zero-downtime deploy
          mkdir -p upload-bundle/upstreams
          cp deploy/nginx/upstreams/${{ inputs.app }}.conf upload-bundle/upstreams/ 2>/dev/null || true
          if [ -f production.env ]; then
            cp production.env upload-bundle/
          fi

      - name: Upload bundle to VPS (retry)
        env:
          VPS_TARGET_DIR: ${{ inputs.vps_target_dir }}
        run: bash .github/scripts/upload-to-vps.sh upload-bundle

      - name: Deploy on VPS (retry)
        env:
          IMAGE: ${{ env.IMAGE }}
          DEPLOY_MODE: ${{ env.DEPLOY_MODE }}
          FORCE_RECREATE: ${{ inputs.env_only == true && 'true' || 'false' }}
          GHCR_PULL_TOKEN: ${{ secrets.ghcr_pull_token }}
          GHCR_USER: ${{ github.repository_owner }}
          VPS_TARGET_DIR: ${{ inputs.vps_target_dir }}
          APP_NAME: ${{ inputs.app }}
          HEALTH_PATH: ${{ inputs.health_path }}
          RUN_MIGRATIONS: ${{ !inputs.env_only && inputs.app == 'messenger-bot' && 'true' || 'false' }}
          MIGRATION_CMD: ${{ env.MIGRATION_CMD }}
          NGINX_UPSTREAM_DIR: /home/ngoc_anh/infra/nginx/upstreams
        run: |
          export IMAGE DEPLOY_MODE FORCE_RECREATE GHCR_PULL_TOKEN GHCR_USER APP_NAME HEALTH_PATH RUN_MIGRATIONS MIGRATION_CMD NGINX_UPSTREAM_DIR
          bash .github/scripts/ssh-deploy-vps.sh ${{ inputs.vps_target_dir }}/vps-deploy.sh
